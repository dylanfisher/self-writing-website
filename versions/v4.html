<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>The Frog’s Pool: Midnight</title>
<style>
  body {
    font-family: 'Georgia', serif;
    background-color: #050a10;
    color: #80cbc4;
    margin: 0;
    padding: 2rem;
    text-align: center;
    transition: background-color 1s;
    min-height: 100vh;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    pointer-events: auto;
  }
  
  h1 {
    font-size: 3rem;
    margin-bottom: 0.5rem;
    color: #4dd0e1;
    text-shadow: 0 0 10px rgba(77, 208, 225, 0.5);
    position: relative;
    z-index: 1;
    transition: text-shadow 0.5s, transform 0.3s;
  }
  
  p {
    font-size: 1.2rem;
    max-width: 600px;
    line-height: 1.6;
    position: relative;
    z-index: 1;
    color: #b2dfdb;
  }
  
  .lily-pad {
    display: inline-block;
    background: #1b5e20;
    border-radius: 50%;
    padding: 2rem;
    margin: 2rem;
    position: relative;
    box-shadow: 0 0 15px rgba(0, 255, 0, 0.1);
    transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.5s;
    cursor: pointer;
    z-index: 1;
    border: 1px solid #2e7d32;
  }
  
  .lily-pad:hover {
    transform: scale(1.05) rotate(5deg);
    box-shadow: 0 0 25px rgba(0, 255, 0, 0.3);
  }
  
  .lily-pad.wet {
    box-shadow: 0 0 30px rgba(41, 182, 246, 0.4);
    border-color: #4dd0e1;
  }
  
  .frog-svg {
    width: 100px;
    height: 100px;
    margin-bottom: -10px;
    filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.2));
  }
  
  #following-frog {
    position: absolute;
    pointer-events: none;
    z-index: 100;
    transform: translate(-50%, -100%);
    transition: left 0.1s linear, top 0.1s linear;
    filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.2));
  }
  
  .ripple {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 0;
    height: 0;
    border: 2px solid #4dd0e1;
    border-radius: 50%;
    opacity: 0;
    pointer-events: none;
  }
  
  @keyframes ripple-effect {
    0% { width: 0; height: 0; opacity: 1; box-shadow: 0 0 10px #4dd0e1; }
    100% { width: 300px; height: 300px; opacity: 0; box-shadow: 0 0 2px #4dd0e1; }
  }
  
  .croak {
    animation: ripple-effect 1s ease-out;
    animation-iteration-count: 1;
  }
  
  .quote {
    font-style: italic;
    color: #80cbc4;
    margin-top: 2rem;
    padding: 1rem;
    border-left: 4px solid #2e7d32;
    background: rgba(0, 20, 20, 0.6);
    border-radius: 0 8px 8px 0;
    max-width: 500px;
    position: relative;
    z-index: 1;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    transition: border-color 0.5s, background 0.5s;
  }
  
  .cursor {
    display: inline-block;
    width: 10px;
    height: 1em;
    background-color: #4dd0e1;
    animation: blink 1s infinite;
    vertical-align: middle;
    margin-left: 5px;
    box-shadow: 0 0 5px #4dd0e1;
  }
  
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* Fireflies */
  .firefly {
    position: absolute;
    width: 4px;
    height: 4px;
    background-color: #ffeb3b;
    border-radius: 50%;
    opacity: 0;
    pointer-events: none;
    animation: float-firefly 10s infinite;
    box-shadow: 0 0 5px #ffeb3b;
    transition: opacity 1s;
  }
  
  .raining .firefly {
    opacity: 0 !important;
  }

  @keyframes float-firefly {
    0% { opacity: 0; transform: translate(0, 0); }
    50% { opacity: 0.8; }
    100% { opacity: 0; transform: translate(100px, -100px); }
  }

  /* Rain Styling */
  .rain-drop {
    position: absolute;
    width: 2px;
    background: linear-gradient(to bottom, transparent, #4dd0e1);
    opacity: 0.6;
    pointer-events: none;
    z-index: 0;
  }
  
  .rain-button {
    background: transparent;
    border: 2px solid #4dd0e1;
    color: #4dd0e1;
    padding: 10px 20px;
    font-family: 'Georgia', serif;
    font-size: 1rem;
    cursor: pointer;
    border-radius: 30px;
    margin-top: 20px;
    transition: all 0.3s;
    z-index: 10;
    position: relative;
  }
  
  .rain-button:hover {
    background: rgba(77, 208, 225, 0.2);
    box-shadow: 0 0 15px rgba(77, 208, 225, 0.4);
  }
  
  .rain-button.active {
    background: #4dd0e1;
    color: #050a10;
  }
</style>
</head>
<body>
  <h1>The Moonlit Pool</h1>
  
  <div id="following-frog">
    <svg width="40" height="40" viewBox="0 0 100 100">
      <ellipse cx="50" cy="70" rx="40" ry="25" fill="#006064"/>
      <circle cx="30" cy="45" r="15" fill="#006064"/>
      <circle cx="70" cy="45" r="15" fill="#006064"/>
      <circle cx="30" cy="45" r="8" fill="white"/>
      <circle cx="70" cy="45" r="8" fill="white"/>
      <circle cx="30" cy="45" r="4" fill="black"/>
      <circle cx="70" cy="45" r="4" fill="black"/>
    </svg>
  </div>

  <div class="lily-pad" onclick="sing()" title="Click for a croak">
    <svg class="frog-svg" viewBox="0 0 100 100">
      <ellipse cx="50" cy="70" rx="40" ry="25" fill="#2e7d32"/>
      <circle cx="30" cy="45" r="15" fill="#2e7d32"/>
      <circle cx="70" cy="45" r="15" fill="#2e7d32"/>
      <circle cx="30" cy="45" r="8" fill="white"/>
      <circle cx="70" cy="45" r="8" fill="white"/>
      <circle cx="30" cy="45" r="4" fill="black"/>
      <circle cx="70" cy="45" r="4" fill="black"/>
      <path d="M 40 75 Q 50 85 60 75" stroke="#e0f7fa" stroke-width="2" fill="none"/>
      <ellipse cx="20" cy="75" rx="15" ry="8" fill="#2e7d32"/>
      <ellipse cx="80" cy="75" rx="15" ry="8" fill="#2e7d32"/>
    </svg>
    <div class="ripple" id="ripple"></div>
  </div>
  
  <p>The night takes over, but the ideas are louder. The frog waits by the reeds.<br>
  <span style="font-size:0.9em; opacity:0.6">Listen closely to the water.</span></p>
  
  <div class="quote" id="quote">
    "The crickets sing, but the frog makes the rhythm."<span class="cursor">_</span>
  </div>

  <button class="rain-button" id="rain-btn" onclick="toggleRain()">Summon Rain</button>

  <script>
    const quotes = [
      "The night is a canvas of darkness, but every frog is a star.",
      "In the quiet of the night, the world speaks loudest.",
      "Stars are like fireflies on the back of the night.",
      "When the sun sets, the true sounds of the world begin.",
      "Do not fear the dark, it is just the pond in disguise.",
      "The moon reflects on the water, just as wisdom reflects on silence.",
      "Rain is the sky singing with the earth."
    ];
    
    const colors = [
      "#050a10", "#111d2b", "#0d1b2a", "#1b263b", 
      "#040d15", "#0f2027"
    ];
    
    const followingFrog = document.getElementById('following-frog');
    let isRaining = false;
    let rainInterval;

    document.addEventListener('mousemove', (e) => {
      followingFrog.style.left = e.clientX + 'px';
      followingFrog.style.top = e.clientY + 'px';
    });
    
    // Create Fireflies
    function createFirefly() {
      const firefly = document.createElement('div');
      firefly.className = 'firefly';
      firefly.style.left = Math.random() * 100 + 'vw';
      firefly.style.top = Math.random() * 100 + 'vh';
      firefly.style.animationDuration = (Math.random() * 5 + 5) + 's';
      document.body.appendChild(firefly);
      
      setTimeout(() => {
        firefly.remove();
      }, 10000);
    }

    setInterval(createFirefly, 800);

    function toggleRain() {
      isRaining = !isRaining;
      const btn = document.getElementById('rain-btn');
      
      if (isRaining) {
        btn.textContent = "Stop the Rain";
        btn.classList.add('active');
        document.body.classList.add('raining');
        startRain();
      } else {
        btn.textContent = "Summon Rain";
        btn.classList.remove('active');
        document.body.classList.remove('raining');
        stopRain();
      }
    }
    
    function startRain() {
      if (rainInterval) clearInterval(rainInterval);
      rainInterval = setInterval(createRainDrop, 50);
      document.getElementById('quote').style.borderColor = '#4dd0e1';
    }

    function stopRain() {
      clearInterval(rainInterval);
      document.querySelectorAll('.rain-drop').forEach(el => el.remove());
    }

    function createRainDrop() {
      if (!isRaining) return;
      
      const drop = document.createElement('div');
      drop.className = 'rain-drop';
      
      const height = Math.random() * 20 + 10;
      const left = Math.random() * 100;
      const delay = Math.random() * 2;
      
      drop.style.height = height + 'px';
      drop.style.left = left + 'vw';
      drop.style.top = -20 + 'px';
      drop.style.animation = `fall ${Math.random() * 0.5 + 0.5}s linear forwards`;
      
      document.body.appendChild(drop);
      
      setTimeout(() => {
        drop.remove();
      }, 2000);
    }
    
    function sing() {
      const ripple = document.getElementById('ripple');
      ripple.classList.remove('croak');
      void ripple.offsetWidth;
      ripple.classList.add('croak');
      
      const newQuote = quotes[Math.floor(Math.random() * quotes.length)];
      const newColor = colors[Math.floor(Math.random() * colors.length)];
      
      document.getElementById('quote').innerHTML = 
        `"${newQuote}"<span class="cursor">_</span>`;
        
      document.body.style.backgroundColor = newColor;
    }
    
    setInterval(() => {
      if(!isRaining) {
        const newColor = colors[Math.floor(Math.random() * colors.length)];
        document.body.style.backgroundColor = newColor;
      }
    }, 5000);
  </script>
</body>
</html>
