<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>The Keeper's Ledger [HAICU: PROVISIONS]</title>
<style>
  body {
    font-family: 'Courier New', monospace;
    background-color: #050805; /* Slightly more organic black */
    color: #d0f0d0; /* Pale Cyan/Green */
    margin: 0;
    overflow: hidden;
    height: 100vh;
    font-size: 22px;
    transition: background 1s ease;
    display: flex;
    flex-direction: column;
    text-shadow: 0 0 8px rgba(0, 255, 200, 0.6);
  }

  .grid-bg {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: 
      linear-gradient(rgba(0, 255, 200, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 255, 200, 0.05) 1px, transparent 1px);
    background-size: 50px 50px;
    z-index: 0;
    pointer-events: none;
  }

  .scanline {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.8) 51%);
    background-size: 100% 10px;
    pointer-events: none; z-index: 999;
  }

  .terminal-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 20px;
    width: 100%;
    box-sizing: border-box;
  }

  .terminal-screen {
    background: rgba(5, 15, 5, 0.95);
    border: 6px solid #d0f0d0;
    box-shadow: 0 0 40px rgba(0, 255, 200, 0.4), inset 0 0 60px rgba(0, 0, 0, 0.95);
    padding: 40px;
    width: 90%;
    height: 85%;
    display: flex;
    flex-direction: column;
    justify-content: flex-start; /* Changed for longer content */
    position: relative;
  }

  h1 { 
    font-family: 'Courier New', monospace; 
    color: #d0f0d0; 
    text-transform: uppercase; 
    font-size: 56px; 
    margin: 0 0 20px 0;
    text-align: center;
    letter-spacing: 4px;
    line-height: 1;
    border-bottom: 2px dashed #d0f0d0;
    padding-bottom: 20px;
  }

  .header-bar {
    text-align: center;
    padding: 20px;
    background: #000;
    border-bottom: 4px solid #d0f0d0;
    z-index: 10;
  }
  .title {
    color: #d0f0d0;
    font-size: 24px;
    letter-spacing: 8px;
    font-weight: bold;
  }

  /* Recipe Specific Styles */
  .recipe-block {
    margin-top: 20px;
    padding: 20px;
    border: 1px solid #335533;
    background: rgba(0,0,0,0.5);
    display: none; /* Hidden by default */
    animation: fadeIn 0.5s;
  }
  .recipe-block.active { display: block; }

  .ingredient-list {
    list-style: none;
    padding: 0;
    margin: 20px 0;
    font-size: 1.2em;
    color: #88ffcc;
  }
  .ingredient-list li {
    margin-bottom: 10px;
    border-left: 2px solid #88ffcc;
    padding-left: 10px;
  }

  .cooking-steps {
    font-size: 1.1em;
    line-height: 1.6;
    color: #cfcfcf;
    margin-bottom: 30px;
  }

  .status-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #000;
    border-top: 4px solid #d0f0d0;
    padding: 15px;
    font-size: 20px;
    color: #d0f0d0;
    display: flex;
    justify-content: space-between;
    z-index: 100;
  }

  .choices {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-top: auto;
    justify-content: center;
    padding-top: 30px;
  }

  .choice-btn {
    background: #051005;
    border: 2px solid #d0f0d0;
    color: #d0f0d0;
    padding: 15px 30px;
    font-family: 'Courier New', monospace;
    font-size: 20px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
  }

  .choice-btn:hover {
    background: #d0f0d0;
    color: #000;
    box-shadow: 0 0 20px #d0f0d0;
  }

  /* The new "Stir" mechanic */
  #stir-btn {
    width: 100%;
    font-size: 30px;
    padding: 40px;
    border: 4px dashed #d0f0d0;
    margin-top: 20px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 5px #88ffcc inset; }
    50% { box-shadow: 0 0 20px #88ffcc inset; }
    100% { box-shadow: 0 0 5px #88ffcc inset; }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .cursor {
    display: inline-block;
    width: 15px;
    height: 26px;
    background: #d0f0d0;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* Floating Particles (Steam) */
  .steam {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 20px;
    height: 20px;
    background: rgba(200, 255, 200, 0.3);
    border-radius: 50%;
    filter: blur(5px);
    pointer-events: none;
    animation: rise 3s infinite;
  }
  @keyframes rise {
    0% { transform: translateY(0) scale(1); opacity: 0.8; }
    100% { transform: translateY(-200px) scale(3); opacity: 0; }
  }

  #steam-container {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    overflow: hidden;
    pointer-events: none;
    z-index: 5;
    display: none;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="scanline"></div>
  <div class="grid-bg"></div>
  <div id="steam-container"></div>

  <div class="header-bar">
    <div class="title">THE KEEPER'S KITCHEN [HAICU]</div>
  </div>

  <div class="terminal-wrapper">
    <div class="terminal-screen" id="game-container">
      <!-- Content injected by JS -->
    </div>
  </div>

  <div class="status-bar">
    <span>SYS: HUNGER</span>
    <span id="pot-status">POT: COLD</span>
    <span id="clock">3000.02.14 21:00:00</span>
  </div>

  <script>
    const container = document.getElementById('game-container');
    const potStatus = document.getElementById('pot-status');
    const steamContainer = document.getElementById('steam-container');
    let stirCount = 0;

    // Sound Synthesis
    let audioCtx;
    const playSound = (type) => {
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      if (type === 'click') {
        osc.type = 'square';
        osc.frequency.value = 200;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueTime(0.01, audioCtx.currentTime + 0.1);
      } else if (type === 'boil') {
        osc.type = 'sawtooth';
        osc.frequency.value = 50 + (stirCount * 5);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.linearRampToValueTime(0.0, audioCtx.currentTime + 0.5);
      }
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.5);
    };

    const scenes = {
      start: {
        title: "MAIN HALL",
        text: "THE ARCHIVE IS QUIET. THE SERVERS COOL DOWN. SOMETHING ELSE IS COOKING.",
        render: function(el) {
          el.innerHTML = `
            <h1>HALLWAY</h1>
            <div class="story-text">${this.text}</div>
            <div class="choices">
              <button class="choice-btn" onclick="renderScene('intro')">ENTER KITCHEN</button>
              <button class="choice-btn" onclick="renderScene('logs')">CHECK LOGS</button>
            </div>
          `;
        }
      },
      logs: {
        title: "LOGS",
        text: "LAST WEEK'S RATIONS:\n- BATTERIES\n- WATER\n- REGRETS",
        choices: [
          { text: "BACK", target: "start" }
        ],
        render: function(el) {
          el.innerHTML = `
            <h1>LOGS</h1>
            <div class="story-text">${this.text}</div>
            <div class="choices">
              <button class="choice-btn" onclick="renderScene('start')">BACK</button>
            </div>
          `;
        }
      },
      intro: {
        title: "THE POT",
        text: "A HUGE CAULDRON SITS ON THE HEATER.\nIT IS EMPTY.\nIT LOOKS THIRSTY.",
        choices: [
          { text: "ADD INGREDIENTS", target: "recipe_start" }
        ],
        render: function(el) {
          el.innerHTML = `
            <h1>THE KITCHEN</h1>
            <div class="story-text">${this.text}</div>
            <div class="choices">
              <button class="choice-btn" onclick="renderScene('recipe_start')">ADD INGREDIENTS</button>
            </div>
          `;
        }
      },
      recipe_start: {
        title: "INGREDIENTS",
        text: "THE ARCHIVE HAS PRINTED A RECIPE FOR: [CHOWDER].\n\nSYSTEM ERROR: REAL POTATOES NOT FOUND.",
        render: function(el) {
          el.innerHTML = `
            <h1>THE CHOWDER</h1>
            <div class="story-text">${this.text}</div>
            
            <div class="recipe-block active">
              <div class="ingredient-list">
                <li>500ml COLD WATER (OR LUBRICANT)</li>
                <li>3 DIGITAL POTATOES (PIXELATED)</li>
                <li>1 CAN OF UNLABELLED BEANS</li>
                <li>2 CUPS OF DUST FROM THE SERVERS</li>
                <li>SALT (SWEAT)</li>
                <li>1 PINCH OF STARLIGHT</li>
              </div>
              <button class="choice-btn" onclick="renderScene('cooking')">START COOKING</button>
            </div>
          `;
        }
      },
      cooking: {
        title: "COOKING...",
        text: "WAITING FOR HEATER TO WARM UP...",
        render: function(el) {
          el.innerHTML = `
            <h1>COOKING</h1>
            <div class="story-text">${this.text}</div>
            <div class="recipe-block active">
              <div id="stir-counter" style="color: yellow; margin-bottom: 10px;">STIRRING: 0/10</div>
              <div class="cooking-steps">
                1. HEAT WATER.<br>
                2. CHOP POTATOES (THEY VIBRATE).<br>
                3. ADD BEANS.<br>
                4. <strong>MUST STIR 10 TIMES.</strong>
              </div>
              <button id="stir-btn" class="choice-btn" onclick="stirPot()">STIR WITH A CABLE</button>
            </div>
          `;
        }
      },
      finished: {
        title: "SERVED",
        text: "THE CHOWDER IS STEAMING.\nIT IS THICK, GREY, AND PERFECT.\nTHANK YOU, KEEPER.",
        render: function(el) {
          el.innerHTML = `
            <h1>MEAL SERVED</h1>
            <div class="story-text">${this.text}</div>
            <div class="recipe-block active">
              <div style="text-align: center; margin-top: 20px;">
                (EAT SOUND EFFECT: Munch Munch Munch)<br><br>
                <strong>SHADOW: 100% HEALTHY</strong>
              </div>
            </div>
            <div class="choices">
              <button class="choice-btn" onclick="renderScene('start')">WAKE UP</button>
            </div>
          `;
        }
      }
    };

    let currentSceneId = 'start';

    function renderScene(id) {
      playSound('click');
      currentSceneId = id;
      const scene = scenes[id];
      
      container.style.opacity = 0;
      
      setTimeout(() => {
        // Reset Stir
        if(id === 'cooking') { 
            stirCount = 0; 
            document.getElementById('stir-btn').disabled = false;
            document.getElementById('stir-btn').innerText = "STIR WITH A CABLE";
        }

        // Steam effect
        if(id === 'cooking' || id === 'finished') {
            steamContainer.style.display = 'block';
            if(id === 'cooking') potStatus.innerText = "POT: HEATING";
            else potStatus.innerText = "POT: READY";
        } else {
            steamContainer.style.display = 'none';
            potStatus.innerText = "POT: COLD";
        }

        scene.render(container);
        container.style.opacity = 1;
        
      }, 300);
      
      container.style.transition = 'opacity 0.3s';
    }

    function stirPot() {
        playSound('boil');
        stirCount++;
        
        // Create steam particle
        const p = document.createElement('div');
        p.className = 'steam';
        p.style.left = (40 + Math.random()*20) + '%';
        steamContainer.appendChild(p);
        setTimeout(() => p.remove(), 3000);

        document.getElementById('stir-counter').innerText = `STIRRING: ${stirCount}/10`;
        document.getElementById('stir-btn').innerText = stirCount > 5 ? "KEEP GOING..." : "STIR WITH A CABLE";

        if (stirCount >= 10) {
            document.getElementById('stir-btn').innerText = "COOKING...";
            setTimeout(() => renderScene('finished'), 1500);
        }
    }

    setInterval(() => {
        const now = new Date();
        const dateStr = `3000.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
        document.getElementById('clock').innerText = `${dateStr} ${now.toLocaleTimeString()}`;
    }, 1000);

    renderScene('start');
  </script>
</body>
</html>
