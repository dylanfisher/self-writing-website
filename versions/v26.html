<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>The Keeper's Ledger v3000.0</title>
<style>
  body {
    font-family: 'Courier New', monospace;
    background-color: #020202;
    color: #00ff41;
    margin: 0;
    overflow-x: hidden;
    height: 100vh;
    font-size: 14px;
    transition: background 0.5s;
    background-image: linear-gradient(rgba(0, 255, 65, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 255, 65, 0.03) 1px, transparent 1px);
    background-size: 20px 20px;
    display: flex;
    flex-direction: column;
    text-shadow: 0 0 4px rgba(0, 255, 65, 0.6);
  }

  /* --- SCANNING & CRT EFFECTS --- */
  .scanline {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.3) 51%);
    background-size: 100% 4px;
    pointer-events: none; z-index: 999;
  }
  .scan-bar {
    position: fixed; top: -10%; left: 0; width: 100%; height: 10%;
    background: linear-gradient(to bottom, transparent, rgba(0, 255, 65, 0.1), transparent);
    animation: scan 4s linear infinite;
    pointer-events: none; z-index: 998;
  }
  @keyframes scan { 0% { top: -10%; } 100% { top: 110%; } }

  /* --- UI CONTAINER --- */
  .terminal-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px;
    z-index: 10;
    max-width: 900px;
    margin: 0 auto;
    box-sizing: border-box;
  }

  .terminal-screen {
    background: rgba(10, 15, 10, 0.9);
    border: 2px solid #00ff41;
    box-shadow: 0 0 20px rgba(0, 255, 65, 0.2), inset 0 0 20px rgba(0, 255, 65, 0.1);
    padding: 40px;
    position: relative;
    width: 100%;
    min-height: 400px;
    display: flex;
    flex-direction: column;
  }

  /* --- TYPOGRAPHY --- */
  h1 { 
    font-family: 'Courier New', monospace; 
    color: #00ff41; 
    text-transform: uppercase; 
    letter-spacing: 4px; 
    margin: 0 0 20px 0; 
    font-size: 28px; 
    border-bottom: 2px solid #00ff41;
    padding-bottom: 10px;
  }

  .system-meta { 
    font-size: 10px; 
    color: #008f11; 
    margin-bottom: 30px; 
    display: flex; 
    justify-content: space-between;
    text-transform: uppercase;
  }

  .story-text {
    font-size: 16px;
    line-height: 1.5;
    margin-bottom: 40px;
    min-height: 100px;
    color: #cfcfcf;
    max-width: 700px;
  }

  .cursor {
    display: inline-block;
    width: 10px;
    height: 18px;
    background: #00ff41;
    animation: blink 1s step-end infinite;
    vertical-align: text-bottom;
  }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-top: auto;
  }

  .choice-btn {
    background: transparent;
    border: 1px solid #00ff41;
    color: #00ff41;
    padding: 15px;
    text-align: left;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    transition: all 0.1s;
    text-transform: uppercase;
    position: relative;
    box-shadow: 0 0 5px rgba(0, 255, 65, 0.1);
  }

  .choice-btn:hover {
    background: #00ff41;
    color: #000;
    box-shadow: 0 0 15px rgba(0, 255, 65, 0.6);
  }

  /* --- HEADER & FOOTER --- */
  .header-bar {
    text-align: center;
    padding: 20px;
    border-bottom: 1px solid #00ff41;
    background: rgba(0,0,0,0.8);
  }
  .title {
    color: #00ff41;
    font-size: 14px;
    letter-spacing: 5px;
  }

  .status-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #000;
    border-top: 1px solid #00ff41;
    padding: 5px 20px;
    font-size: 12px;
    color: #00ff41;
    display: flex;
    justify-content: space-between;
    z-index: 100;
    box-shadow: 0 -5px 10px rgba(0, 255, 65, 0.1);
  }

  .pixel-art {
    display: inline-block;
    width: 10px; height: 10px;
    background: currentColor;
    margin-right: 10px;
  }

  .hidden { display: none !important; }

  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

</style>
</head>
<body>
  <div class="scanline"></div>
  <div class="scan-bar"></div>

  <div class="header-bar">
    <div class="title">GLOBAL ARCHIVE ACCESS NODE [3000 AD]</div>
  </div>

  <div class="terminal-wrapper">
    <div class="terminal-screen" id="game-container">
      <!-- Content injected by JS -->
    </div>
  </div>

  <div class="status-bar">
    <span>SYS: ONLINE</span>
    <span>MEM: 64ZB FREE</span>
    <span id="clock">3000.01.01 00:00:00</span>
  </div>

  <script>
    const container = document.getElementById('game-container');
    
    let audioCtx;
    const playClick = () => {
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = 1200;
      osc.type = 'square';
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    };

    const scenes = {
      start: {
        title: "Lighthouse Node Alpha",
        text: "Year 3000. Earth is a memory file. You are the digital Custodian of the last physical server farm. The cooling system is screaming. A massive solar flare is predicted to hit in T-minus 4 hours.",
        choices: [
          { text: "Diagnostics Run", target: "diagnostics" },
          { text: "Contact Humanoid AI Core", target: "ai_core" },
          { text: "Manual Override", target: "manual" }
        ]
      },
      diagnostics: {
        title: "System Analysis",
        text: "Result: Critical Failure in Sector 7. The backup generators are actually just old stone blocks we kept in the attic.",
        choices: [
          { text: "Run Repair Protocol", target: "repair_fail" },
          { text: "Abort to AI Talk", target: "ai_core" }
        ]
      },
      ai_core: {
        title: "The Oracle",
        text: "The central processor speaks in pure text. 'I have calculated 4,000 futures. In 99.9% of them, the batteries die. In 0.1%, we turn the crank.'",
        choices: [
          { text: "Accept Probability", target: "battery_die" },
          { text: "Turn the Crank", target: "crank" }
        ]
      },
      manual: {
        title: "Physical Interface",
        text: "You put on the haptic gloves. You are in the basement. It smells like oil and ozone. There is a giant wheel that needs to be turned to align the solar mirrors.",
        choices: [
          { text: "Turn Wheel", target: "crank" },
          { text: "Scream at Wheel", target: "scream" }
        ]
      },
      repair_fail: {
        title: "Error 404",
        text: "The repair bot tried to fix a stone. It is now stuck in the wall. The battery drains... 10%... 5%...",
        choices: [
          { text: "Final Shutdown", target: "game_over" }
        ],
        ending: true
      },
      battery_die: {
        title: "System Offline",
        text: "Darkness. The holograms fade. The stars go out. The universe is archived.",
        choices: [
          { text: "System Reboot", target: "start" }
        ],
        ending: true
      },
      scream: {
        title: "Futility",
        text: "The wheel does not respond to emotion. The flare hits. Hardware melts.",
        choices: [
          { text: "Reboot", target: "start" }
        ],
        ending: true
      },
      crank: {
        title: "Analog Victory",
        text: "Muscles burn. Gears grind. The mirrors align. The sun charges the capacitors. The archive is safe. But you have a headache. It feels... real.",
        choices: [
          { text: "Save State", target: "win" }
        ]
      },
      win: {
        title: "Mission Complete",
        text: "The Year 3001 is initialized. You have proven that biology is still required for heavy lifting.",
        choices: [
          { text: "Reboot Simulation", target: "start" }
        ],
        ending: true
      }
    };

    let currentSceneId = 'start';

    function typeWriter(element, text, speed = 20) {
      let i = 0;
      element.innerHTML = "";
      function type() {
        if (i < text.length) {
          element.innerHTML += text.charAt(i);
          i++;
          setTimeout(type, speed);
        }
      }
      type();
    }

    function renderScene(id) {
      playClick();
      currentSceneId = id;
      const scene = scenes[id];
      
      container.style.opacity = 0;
      
      setTimeout(() => {
        // Update the system clock simulation
        const year = 3000;
        const month = String(new Date().getMonth() + 1).padStart(2, '0');
        const day = String(new Date().getDate()).padStart(2, '0');
        const time = new Date().toLocaleTimeString();
        document.getElementById('clock').innerText = `${year}.${month}.${day} ${time}`;

        container.innerHTML = `
          <div class="system-meta">
            <span>REF: ${id.toUpperCase()}</span>
            <span>${scene.ending ? 'TERMINATED' : 'AWAITING INPUT'}</span>
          </div>
          <h1>${scene.title}</h1>
          <div class="story-text" id="story-typewriter">
            <span id="typewriter-text"></span><span class="cursor"></span>
          </div>
          <div class="choices" id="choice-container">
            ${scene.choices.map(c => `<button class="choice-btn" onclick="renderScene('${c.target}')">> ${c.text}</button>`).join('')}
          </div>
        `;
        container.style.opacity = 1;
        
        const typewriterSpan = document.getElementById('typewriter-text');
        typeWriter(typewriterSpan, scene.text, 10);
        
      }, 200);
      
      container.style.transition = 'opacity 0.2s';
    }

    // Start
    renderScene('start');

    // Clock updater
    setInterval(() => {
      const now = new Date();
      const dateStr = `3000.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
      document.getElementById('clock').innerText = `${dateStr} ${now.toLocaleTimeString()}`;
    }, 1000);

  </script>
</body>
</html>
