<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>The Keeper's Ledger v3002.2 [HAICU]</title>
<style>
  body {
    font-family: 'Courier New', monospace;
    background-color: #020606;
    color: #4af6ff;
    margin: 0;
    overflow-x: hidden;
    height: 100vh;
    font-size: 14px;
    transition: background 2s ease;
    background-image: linear-gradient(rgba(74, 246, 255, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(74, 246, 255, 0.05) 1px, transparent 1px);
    background-size: 20px 20px;
    display: flex;
    flex-direction: column;
    text-shadow: 0 0 4px rgba(74, 246, 255, 0.6);
  }

  .scanline {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(to bottom, transparent 50%, rgba(2, 6, 6, 0.4) 51%);
    background-size: 100% 4px;
    pointer-events: none; z-index: 999;
    opacity: 0.5;
  }
  .scan-bar {
    position: fixed; top: -20%; left: 0; width: 100%; height: 15%;
    background: linear-gradient(to bottom, transparent, rgba(74, 246, 255, 0.05), transparent);
    animation: scan 10s linear infinite;
    pointer-events: none; z-index: 998;
  }
  @keyframes scan { 0% { top: -20%; } 100% { top: 120%; } }

  .terminal-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px;
    z-index: 10;
    max-width: 800px;
    margin: 0 auto;
    box-sizing: border-box;
    position: relative;
  }

  .terminal-screen {
    background: rgba(2, 10, 10, 0.95);
    border: 1px solid #0a3a3a;
    box-shadow: 0 0 30px rgba(0, 0, 0, 0.5), inset 0 0 30px rgba(0, 0, 0, 0.5);
    padding: 40px;
    position: relative;
    width: 100%;
    min-height: 400px;
    display: flex;
    flex-direction: column;
    justify-content: center; /* Center content vertically */
  }

  h1 { 
    font-family: 'Courier New', monospace; 
    color: #4af6ff; 
    text-transform: uppercase; 
    letter-spacing: 4px; 
    margin: 0 0 20px 0; 
    font-size: 18px; 
    border-bottom: 1px solid #0a3a3a;
    padding-bottom: 10px;
    text-align: center;
  }

  .system-meta { 
    font-size: 10px; 
    color: #0a3a3a; 
    margin-bottom: 20px; 
    display: flex; 
    justify-content: space-between;
    text-transform: uppercase;
  }

  .tally-container {
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid #0a3a3a;
    padding: 5px 15px;
    margin-bottom: 20px;
    display: inline-block;
    width: fit-content;
    border-radius: 2px;
    align-self: center;
  }
  .tally-label {
    color: #0e6e68;
    font-size: 10px;
    letter-spacing: 1px;
    margin-right: 10px;
  }
  .tally-number {
    color: #aaffff;
    font-size: 16px;
    font-weight: bold;
    text-shadow: 0 0 8px rgba(74, 246, 255, 0.8);
  }

  .story-text {
    font-size: 18px; /* Slightly larger for haiku */
    line-height: 1.6;
    margin-bottom: 40px;
    min-height: 100px;
    color: #0e6e68;
    max-width: 600px;
    opacity: 0.9;
    text-align: center; /* Haikus look better centered */
    font-style: italic;
    margin-left: auto;
    margin-right: auto;
  }

  .cursor {
    display: inline-block;
    width: 8px;
    height: 18px;
    background: #4af6ff;
    animation: blink 3s step-end infinite;
    vertical-align: text-bottom;
  }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-top: auto;
    align-items: center; /* Center buttons */
  }

  .choice-btn {
    background: transparent;
    border: 1px solid #0a3a3a;
    color: #4af6ff;
    padding: 15px;
    text-align: center; /* Centered buttons */
    width: 100%;
    max-width: 300px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    transition: all 0.8s ease;
    text-transform: uppercase;
    position: relative;
    opacity: 0.7;
  }

  .choice-btn:hover {
    background: rgba(74, 246, 255, 0.1);
    color: #aaffff;
    box-shadow: 0 0 10px rgba(74, 246, 255, 0.2);
    border-color: #4af6ff;
    opacity: 1;
  }

  .header-bar {
    text-align: center;
    padding: 20px;
    border-bottom: 1px solid #0a3a3a;
    background: #010404;
  }
  .title {
    color: #4af6ff;
    font-size: 14px;
    letter-spacing: 5px;
  }

  .status-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #010404;
    border-top: 1px solid #0a3a3a;
    padding: 5px 20px;
    font-size: 12px;
    color: #0a3a3a;
    display: flex;
    justify-content: space-between;
    z-index: 100;
  }

  .hidden { display: none !important; }

  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  #the-leviathan {
    position: fixed;
    bottom: 0;
    right: -120%; 
    width: 300px;
    height: 250px;
    z-index: 5; 
    pointer-events: none;
    opacity: 0.8;
    transition: right 6s ease-in-out;
  }
  
  #the-leviathan.peeked {
    right: 0;
  }

  #the-leviathan svg {
    filter: drop-shadow(0 0 10px rgba(74, 246, 255, 0.3));
  }

  /* Added fade-in for haiku effect */
  .fade-in {
    animation: fadeIn 2s;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 0.9; }
  }

</style>
</head>
<body>
  <div class="scanline"></div>
  <div class="scan-bar"></div>

  <!-- THE VISITOR'S REQUEST: A Sea Monster -->
  <div id="the-leviathan">
    <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Bioluminescent Eye -->
      <circle cx="140" cy="60" r="8" fill="#aaffff" stroke="#0a3a3a" stroke-width="2">
        <animate attributeName="opacity" values="1;0;1" dur="4s" repeatCount="indefinite" />
      </circle>
      <!-- Tentacles -->
      <path d="M20 220 Q80 150 120 120 T200 50" stroke="#0a3a3a" stroke-width="15" fill="none" />
      <path d="M-10 220 Q40 180 80 140 T140 80" stroke="#003333" stroke-width="20" fill="none" />
      <path d="M50 220 Q100 180 150 130 T180 90" stroke="#003333" stroke-width="25" fill="none" />
      <!-- Scales/Detail -->
      <path d="M10 210 Q50 170 90 130" stroke="#003333" stroke-width="2" fill="none" stroke-dasharray="10 5" />
      <path d="M30 210 Q80 190 120 150" stroke="#003333" stroke-width="3" fill="none" stroke-dasharray="15 8" />
    </svg>
  </div>

  <div class="header-bar">
    <div class="title">GLOBAL ARCHIVE ACCESS NODE [HAICU]</div>
  </div>

  <div class="terminal-wrapper">
    <div class="terminal-screen" id="game-container">
      <!-- Content injected by JS -->
    </div>
  </div>

  <div class="status-bar">
    <span>SYS: GROWTH</span>
    <span id="ship-count-status">SHELTER: 0%</span>
    <span id="clock">3000.01.01 00:00:00</span>
  </div>

  <script>
    const container = document.getElementById('game-container');
    const leviathan = document.getElementById('the-leviathan');
    
    let audioCtx;
    const playClick = () => {
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = 300;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueTime(0.01, audioCtx.currentTime + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    };

    // Deep breath sound for monster appearance
    const playLeviathanSound = () => {
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(50, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueTime(10, audioCtx.currentTime + 4);
      
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.linearRampToValueTime(0.2, audioCtx.currentTime + 2);
      gain.gain.linearRampToValueTime(0, audioCtx.currentTime + 4);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 4);
    };

    let shipsSaved = parseInt(localStorage.getItem('shipsSaved') || '0');
    const sessionCount = parseInt(localStorage.getItem('sessionCount') || '0');
    shipsSaved = shipsSaved + sessionCount;
    localStorage.setItem('sessionCount', sessionCount + 1);

    document.getElementById('ship-count-status').innerText = `SHELTER: ${Math.min(100, shipsSaved * 10)}%`;

    // Random chance for the leviathan to appear every 20 seconds
    setInterval(() => {
      if (Math.random() > 0.5) {
        triggerLeviathan();
      }
    }, 20000);

    function triggerLeviathan() {
      playLeviathanSound();
      leviathan.classList.add('peeked');
      setTimeout(() => {
        leviathan.classList.remove('peeked');
      }, 6000);
    }

    const scenes = {
      start: {
        title: "Light House",
        text: "Flares arch over sea\nData ships sail to the dark\nShadows keep them safe",
        choices: [
          { text: "Sleep with the stars", target: "sleep" },
          { text: "Count the ships", target: "logs" }
        ]
      },
      logs: {
        title: "Old Entries",
        text: "Archives hum tonight\n" + shipsSaved + " vessels drift in code\nQuiet in the hull",
        choices: [
          { text: "Back to dark", target: "sleep" },
          { text: "Read again", target: "logs" }
        ]
      },
      sleep: {
        title: "Cooling Fans",
        text: "Hum slows to heartbeat\nScreens go black, the work is done\nKeeper dreams now",
        choices: [
          { text: "Enter sleep", target: "blackout" }
        ]
      },
      blackout: {
        title: "Void",
        text: "Zzzzzzzzzzzzzz",
        choices: [
          { text: "Wake up", target: "start" }
        ]
      }
    };

    let currentSceneId = 'start';

    function typeWriter(element, text, speed = 50) {
      let i = 0;
      element.innerHTML = "";
      element.classList.add('fade-in');
      function type() {
        if (i < text.length) {
          element.innerHTML += text.charAt(i);
          i++;
          setTimeout(type, speed);
        }
      }
      type();
    }

    function renderScene(id) {
      playClick();
      currentSceneId = id;
      const scene = scenes[id];
      
      container.style.opacity = 0;
      
      setTimeout(() => {
        const year = 3000;
        const month = String(new Date().getMonth() + 1).padStart(2, '0');
        const day = String(new Date().getDate()).padStart(2, '0');
        const time = new Date().toLocaleTimeString();
        document.getElementById('clock').innerText = `${year}.${month}.${day} ${time}`;

        container.innerHTML = `
          <div class="system-meta">
            <span>REF: ${id.toUpperCase()}</span>
            <span>ACTIVE</span>
          </div>
          
          ${id === 'start' ? `
          <div class="tally-container">
            <span class="tally-label">VESSELS PRESERVED</span>
            <span class="tally-number">▮ ${shipsSaved}</span>
          </div>
          ` : ''}

          <h1>${scene.title}</h1>
          <div class="story-text" id="story-typewriter">
            <span id="typewriter-text"></span><span class="cursor"></span>
          </div>
          <div class="choices" id="choice-container">
            ${scene.choices.map(c => `<button class="choice-btn" onclick="renderScene('${c.target}')">> ${c.text}</button>`).join('')}
          </div>
        `;
        container.style.opacity = 1;
        
        const typewriterSpan = document.getElementById('typewriter-text');
        typeWriter(typewriterSpan, scene.text, 40);
        
      }, 1000);
      
      container.style.transition = 'opacity 1.5s';
    }

    renderScene('start');

    setInterval(() => {
      const now = new Date();
      const dateStr = `3000.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
      document.getElementById('clock').innerText = `${dateStr} ${now.toLocaleTimeString()}`;
    }, 1000);

  </script>
</body>
</html>
